  <style>
    body {
      background-color: #0e0e0e; /* optional dark background */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .video-wrapper {
      position: relative;
      width: 80%; /* adjust this (e.g. 70%, 60%) to make it smaller or larger */

      overflow: hidden;
    }

    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
